services:
  classifier:
    build: .
    image: microbatch-classifier:latest
    ports:
      - "8000:8000"
    environment:
      # Spec limits (defaults already match the spec):
      MAX_CAPACITY: "16"      # max images queued or computing
      BATCH_SIZE: "4"         # max images per batch
      BATCH_WAIT_MS: "50"     # idle model waits at most 50 ms to fill a batch
      # Demo knob: simulate slow inference (ms). Submit/query/cancel stay
      # responsive regardless. 2000 lets /docs show POST/GET /drain observing
      # "model_computing" then flipping to ready_to_shutdown. Set "0" for the
      # zero-delay default behaviour.
      INFERENCE_DELAY_MS: "2000"
    restart: unless-stopped
